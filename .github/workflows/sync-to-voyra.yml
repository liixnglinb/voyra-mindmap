name: Sync to Voyra

# 本仓库 push 后，把 AI Agent 思维导图 代码自动同步进 Voyra 主仓库并触发部署
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Voyra-mindmap
        uses: actions/checkout@v4

      - name: Checkout Voyra main repo
        uses: actions/checkout@v4
        with:
          repository: liixnglinb/Voyra
          token: ${{ secrets.VOYRA_SYNC_TOKEN }}
          path: voyra

      - name: Sync files
        run: |
          cp "src/pages/MindMap.jsx" "voyra/src/pages/MindMap.jsx"
          cp "src/components/MindMapFrame.jsx" "voyra/src/components/MindMapFrame.jsx"

      - name: Commit & push to Voyra
        run: |
          cd voyra
          git config user.name "Voyra-mindmap-sync[bot]"
          git config user.email "liixnglinb@users.noreply.github.com"
          git add src/pages/MindMap.jsx src/components/MindMapFrame.jsx
          if git diff --cached --quiet; then
            echo "无代码变更，跳过提交"
            exit 0
          fi
          git commit -m "chore(Voyra-mindmap): 自动同步自 Voyra-mindmap ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

